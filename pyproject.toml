[project]
name = "recipes"
version = "0.1.0"
description = "Our recipes, plans, and the skill that manages them."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.13", "ty>=0.0.1a20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".agents/skills/recipes/scripts"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["cookbook", "conftest"]

[tool.ty.environment]
python-version = "3.10"
extra-paths = [".agents/skills/recipes/scripts", "tests"]
