name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run ty check
      - run: uv run pytest
      - run: uv run scripts/recipes.py build dist/site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/site
          retention-days: 1

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: bundle
      - uses: actions/checkout@v4
        with:
          repository: collinmurch/collinmurch.github.io
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site
      # Commits the bundle to the site's recipes-data/, and that push deploys the
      # site. Runs can finish out of order, so a run skips when the site already
      # has this commit's bundle or a newer one. If the site's main moved on, the
      # push is retried on top of the new tip.
      - name: Commit the bundle to the site
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            published=$(jq -r '.commit // empty' recipes-data/index.json 2>/dev/null || true)
            if [ -n "$published" ]; then
              status=$(gh api "repos/${{ github.repository }}/compare/${{ github.sha }}...$published" --jq .status) || status=unknown
              if [ "$status" = identical ] || [ "$status" = ahead ]; then
                echo "The site already has the bundle from $published"
                exit 0
              fi
            fi
            rm -rf recipes-data
            cp -R ../bundle recipes-data
            git add -A recipes-data
            if git diff --cached --quiet; then
              echo "The bundle is unchanged"
              exit 0
            fi
            git commit -qm "Update recipes to ${{ github.repository }}@${GITHUB_SHA::7}"
            if git push -q origin HEAD:main; then exit 0; fi
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "::error::Could not push the bundle to the site"
          exit 1
